<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
        <h1 class="h2 mb-0">Alumnos</h1>
        <a class="btn btn-primary" th:href="@{/alumnos/crear}">Crear alumno</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>NIA</th><th>Nombre</th><th>Apellidos</th><th>Email</th><th>Grupo</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="alumno : ${listaAlumnos}">
                <td th:text="${alumno.id}"></td>
                <td th:text="${alumno.nia}"></td>
                <td th:text="${alumno.nombre}"></td>
                <td><span th:text="${alumno.apellido1}"></span> <span th:text="${alumno.apellido2}"></span></td>
                <td th:text="${alumno.email}"></td>
                <td th:if="${alumno.grupoId == null}">Sin grupo</td>
                <td th:unless="${alumno.grupoId == null}" th:text="${nombresGrupos[alumno.grupoId]}"></td>
                <td class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/alumnos/editar/{id}(id=${alumno.id})}">Editar</a>
                    <form th:action="@{/alumnos/borrar/{id}(id=${alumno.id})}" method="post">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listaAlumnos)}"><td colspan="7" class="text-center text-body-secondary">No hay alumnos registrados.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
