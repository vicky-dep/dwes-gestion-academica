<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloFormulario}">Profesor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
        <h1 class="h2 mb-0" th:text="${tituloFormulario}">Profesor</h1>
        <a class="btn btn-outline-secondary" th:href="@{/profesores}">Volver</a>
    </div>
    <form th:action="${accionFormulario}" th:object="${profesor}" method="post" class="row g-3">
        <div class="col-md-6"><label for="nif" class="form-label">NIF</label><input id="nif" class="form-control" th:field="*{nif}" required maxlength="9"></div>
        <div class="col-md-6"><label for="nombre" class="form-label">Nombre</label><input id="nombre" class="form-control" th:field="*{nombre}" required maxlength="100"></div>
        <div class="col-md-6"><label for="apellido1" class="form-label">Primer apellido</label><input id="apellido1" class="form-control" th:field="*{apellido1}" required maxlength="100"></div>
        <div class="col-md-6"><label for="apellido2" class="form-label">Segundo apellido</label><input id="apellido2" class="form-control" th:field="*{apellido2}" maxlength="100"></div>
        <div class="col-md-6"><label for="departamento" class="form-label">Departamento</label><input id="departamento" class="form-control" th:field="*{departamento}" required maxlength="100"></div>
        <div class="col-md-6"><label for="email" class="form-label">Email</label><input id="email" type="email" class="form-control" th:field="*{email}" required maxlength="150"></div>
        <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/profesores}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
