<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del profesor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
        <h1 class="h2 mb-0">Detalle del profesor</h1>
        <a class="btn btn-outline-secondary" th:href="@{/profesores}">Volver</a>
    </div>

    <section class="mb-5">
        <h2 class="h4 mb-3" th:text="${profesor.nombre} + ' ' + ${profesor.apellido1} + ' ' + ${profesor.apellido2}"></h2>
        <dl class="row">
            <dt class="col-sm-3">ID</dt>
            <dd class="col-sm-9" th:text="${profesor.id}"></dd>
            <dt class="col-sm-3">NIF</dt>
            <dd class="col-sm-9" th:text="${profesor.nif}"></dd>
            <dt class="col-sm-3">Departamento</dt>
            <dd class="col-sm-9" th:text="${profesor.departamento}"></dd>
            <dt class="col-sm-3">Email</dt>
            <dd class="col-sm-9" th:text="${profesor.email}"></dd>
        </dl>
    </section>

    <section class="mb-5">
        <h2 class="h4 mb-3">Grupos que tutoriza</h2>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead><tr><th>Código</th><th>Nombre</th><th>Curso</th></tr></thead>
                <tbody>
                <tr th:each="grupo : ${grupos}">
                    <td th:text="${grupo.codigo}"></td>
                    <td th:text="${grupo.nombre}"></td>
                    <td th:text="${grupo.curso}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(grupos)}"><td colspan="3" class="text-body-secondary">No tutoriza grupos.</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="mb-5">
        <h2 class="h4 mb-3">Alumnos tutorizados</h2>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead><tr><th>NIA</th><th>Nombre</th><th>Apellidos</th><th>Grupo</th><th>Email</th></tr></thead>
                <tbody>
                <tr th:each="alumno : ${alumnos}">
                    <td th:text="${alumno.nia}"></td>
                    <td th:text="${alumno.nombre}"></td>
                    <td><span th:text="${alumno.apellido1}"></span> <span th:text="${alumno.apellido2}"></span></td>
                    <td><span th:text="${alumno.codigoGrupo}"></span> - <span th:text="${alumno.nombreGrupo}"></span></td>
                    <td th:text="${alumno.email}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(alumnos)}"><td colspan="5" class="text-body-secondary">No hay alumnos en sus grupos.</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <section>
        <h2 class="h4 mb-3">Alumnos por grupo</h2>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead><tr><th>Grupo</th><th>Total de alumnos</th></tr></thead>
                <tbody>
                <tr th:each="resumen : ${resumenGrupos}">
                    <td th:text="${resumen.codigo}"></td>
                    <td th:text="${resumen.totalAlumnos}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(resumenGrupos)}"><td colspan="2" class="text-body-secondary">No hay grupos que resumir.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
