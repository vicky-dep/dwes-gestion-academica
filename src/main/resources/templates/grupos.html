<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grupos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
        <h1 class="h2 mb-0">Grupos</h1>
        <a class="btn btn-primary" th:href="@{/grupos/crear}">Crear grupo</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>Código</th><th>Nombre</th><th>Curso</th><th>Tutor</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="grupo : ${listaGrupos}">
                <td th:text="${grupo.id}"></td>
                <td th:text="${grupo.codigo}"></td>
                <td th:text="${grupo.nombre}"></td>
                <td th:text="${grupo.curso}"></td>
                <td th:if="${grupo.tutorId == null}">Sin tutor</td>
                <td th:unless="${grupo.tutorId == null}" th:text="${nombresProfesores[grupo.tutorId]}"></td>
                <td class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/grupos/editar/{id}(id=${grupo.id})}">Editar</a>
                    <form th:action="@{/grupos/borrar/{id}(id=${grupo.id})}" method="post">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listaGrupos)}"><td colspan="6" class="text-center text-body-secondary">No hay grupos registrados.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
