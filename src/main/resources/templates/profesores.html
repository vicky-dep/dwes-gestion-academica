<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profesores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
        <h1 class="h2 mb-0">Profesores</h1>
        <a class="btn btn-primary" th:href="@{/profesores/crear}">Crear profesor</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>NIF</th><th>Nombre</th><th>Apellidos</th><th>Departamento</th><th>Email</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="profesor : ${listaProfesores}">
                <td th:text="${profesor.id}"></td>
                <td th:text="${profesor.nif}"></td>
                <td th:text="${profesor.nombre}"></td>
                <td><span th:text="${profesor.apellido1}"></span> <span th:text="${profesor.apellido2}"></span></td>
                <td th:text="${profesor.departamento}"></td>
                <td th:text="${profesor.email}"></td>
                <td class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/profesores/editar/{id}(id=${profesor.id})}">Editar</a>
                    <form th:action="@{/profesores/borrar/{id}(id=${profesor.id})}" method="post">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listaProfesores)}"><td colspan="7" class="text-center text-body-secondary">No hay profesores registrados.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
