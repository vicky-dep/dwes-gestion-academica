<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloFormulario}">Grupo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
        <h1 class="h2 mb-0" th:text="${tituloFormulario}">Grupo</h1>
        <a class="btn btn-outline-secondary" th:href="@{/grupos}">Volver</a>
    </div>
    <form th:action="${accionFormulario}" th:object="${grupo}" method="post" class="row g-3">
        <div class="col-md-6"><label for="codigo" class="form-label">Código</label><input id="codigo" class="form-control" th:field="*{codigo}" required maxlength="20"></div>
        <div class="col-md-6"><label for="nombre" class="form-label">Nombre</label><input id="nombre" class="form-control" th:field="*{nombre}" required maxlength="100"></div>
        <div class="col-md-6"><label for="curso" class="form-label">Curso</label><input id="curso" type="number" class="form-control" th:field="*{curso}" required></div>
        <div class="col-md-6">
            <label for="tutorId" class="form-label">Tutor</label>
            <select id="tutorId" class="form-select" th:field="*{tutorId}">
                <option value="">Sin tutor</option>
                <option th:each="profesor : ${listaProfesores}" th:value="${profesor.id}"
                        th:text="${profesor.nombre + ' ' + profesor.apellido1}"></option>
            </select>
        </div>
        <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/grupos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
